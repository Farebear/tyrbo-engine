# TYRBO-PATCH: Fly staging config for the engine API (M1 exit: "fork on Fly staging").
#
# Deploy (pin a SHA tag from the tyrbo-release workflow, not the moving branch tag):
#   fly deploy -c tyrbo-deploy/fly.api.staging.toml --image ghcr.io/farebear/tyrbo-engine-api:<sha>
#
# Secrets (fly secrets set -a tyrbo-engine-api-staging ...) — see README.md:
#   AP_ENCRYPTION_KEY  AP_JWT_SECRET
#   AP_POSTGRES_HOST  AP_POSTGRES_PORT  AP_POSTGRES_DATABASE  AP_POSTGRES_USERNAME  AP_POSTGRES_PASSWORD
#   AP_REDIS_URL
#   AP_TYRBO_JWT_PUBLIC_KEY  AP_TYRBO_WEBHOOK_SECRET
#   (AP_TYRBO_API_URL stays unset until the product API ships its receiver in S5/M2b;
#    add AP_SSRF_ALLOW_LIST alongside it if the URL is private)

app = "tyrbo-engine-api-staging"
primary_region = "iad"

[build]
image = "ghcr.io/farebear/tyrbo-engine-api:f460c4cf05782618b6900e95bc836b54e6570a6b"

[env]
AP_CONTAINER_TYPE = "APP"
AP_ENVIRONMENT = "prod"
AP_EDITION = "ce"
# must be resolvable by the worker app too — public URL, not .internal
AP_FRONTEND_URL = "https://tyrbo-engine-api-staging.fly.dev"
AP_DB_TYPE = "POSTGRES"
AP_QUEUE_MODE = "REDIS"
AP_EXECUTION_MODE = "UNSANDBOXED"
AP_TELEMETRY_ENABLED = "false"
AP_TYRBO_JWT_ISSUER = "tyrbo"
# Must exceed the browser piece's wait budget: the browser-worker fleet caps
# a browser.run at 30 min (RUN_TIMEOUT_MS = 1_800_000) and the piece allows
# TYRBO_BROWSER_QUEUE_WAIT_MS = 120_000 on top (1920 s total), so a flow with
# a long cloud browser group must not hit the engine flow timeout first.
# Read api-side and shipped to workers via the worker-settings response —
# setting it on the worker app would be a no-op.
AP_FLOW_TIMEOUT_SECONDS = "2100"
# warn, not info: the queue dispatcher logs several lines/sec at info, which
# is measurable CPU at shared-cpu-1x baseline (1/16 vCPU) and drains burst credits
AP_LOG_LEVEL = "warn"
# @tyrbo/piece-browser (M6) + @tyrbo/piece-ai (M8.5) are file-loaded from the
# image — never on the AP cloud registry; this also merges them into
# /v1/pieces metadata responses.
AP_DEV_PIECES = "browser,ai"
# The engine child (where piece code runs) gets a whitelisted env; the pieces
# need the queue Redis + pool-wake config + Tyrbo-managed AI provider keys
# (TYRBO_AI_*) propagated from the WORKER app's env/secrets (values are read
# worker-side; this list is configured api-side).
AP_SANDBOX_PROPAGATED_ENV_VARS = "AP_REDIS_URL,AP_REDIS_HOST,AP_REDIS_PORT,AP_REDIS_USER,AP_REDIS_PASSWORD,AP_REDIS_DB,AP_REDIS_USE_SSL,TYRBO_BROWSER_POOL_APP,TYRBO_FLY_API_TOKEN,TYRBO_BROWSER_WARM_SPARES,TYRBO_BROWSER_RUN_TIMEOUT_MS,TYRBO_BROWSER_QUEUE_WAIT_MS,TYRBO_AI_ANTHROPIC_KEY,TYRBO_AI_OPENAI_KEY"

[http_service]
internal_port = 80
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
# the worker long-polls the API, which keeps it awake; 0 still lets Fly
# park it if the worker is scaled down
min_machines_running = 0

[[http_service.checks]]
interval = "15s"
timeout = "5s"
grace_period = "45s"
method = "GET"
path = "/api/v1/health"

# Sizing history, measured 2026-07-14 — do not downsize without re-measuring:
# - 512MB OOM-ish: piece sync stalls the event loop into health-check
#   timeouts, the proxy 503s everything and auto-stops the machine.
# - shared-cpu-1x starves: burst credits drain in ~10-20 min of engine load,
#   top shows ~80% steal, health checks fail, proxy pulls the machine.
#   2x doubles the baseline (12.5%) and credit accrual for ~$2/mo more.
[[vm]]
size = "shared-cpu-2x"
memory = "1gb"

swap_size_mb = 512
