# TYRBO-PATCH: Fly staging config for the engine API (M1 exit: "fork on Fly staging").
#
# Deploy (pin a SHA tag from the tyrbo-release workflow, not the moving branch tag):
#   fly deploy -c tyrbo-deploy/fly.api.staging.toml --image ghcr.io/farebear/tyrbo-engine-api:<sha>
#
# Secrets (fly secrets set -a tyrbo-engine-api-staging ...) — see README.md:
#   AP_ENCRYPTION_KEY  AP_JWT_SECRET
#   AP_POSTGRES_HOST  AP_POSTGRES_PORT  AP_POSTGRES_DATABASE  AP_POSTGRES_USERNAME  AP_POSTGRES_PASSWORD
#   AP_REDIS_URL
#   AP_TYRBO_JWT_PUBLIC_KEY  AP_TYRBO_WEBHOOK_SECRET
#   (AP_TYRBO_API_URL stays unset until the product API ships its receiver in S5/M2b;
#    add AP_SSRF_ALLOW_LIST alongside it if the URL is private)

app = "tyrbo-engine-api-staging"
primary_region = "iad"

[build]
image = "ghcr.io/farebear/tyrbo-engine-api:tyrbo"

[env]
AP_CONTAINER_TYPE = "APP"
AP_ENVIRONMENT = "prod"
AP_EDITION = "ce"
# must be resolvable by the worker app too — public URL, not .internal
AP_FRONTEND_URL = "https://tyrbo-engine-api-staging.fly.dev"
AP_DB_TYPE = "POSTGRES"
AP_QUEUE_MODE = "REDIS"
AP_EXECUTION_MODE = "UNSANDBOXED"
AP_TELEMETRY_ENABLED = "false"
AP_TYRBO_JWT_ISSUER = "tyrbo"
AP_LOG_LEVEL = "info"
# @tyrbo/piece-browser (M6) is file-loaded from the image — never on the AP
# cloud registry; this also merges it into /v1/pieces metadata responses.
AP_DEV_PIECES = "browser"
# The engine child (where piece code runs) gets a whitelisted env; the piece
# needs the queue Redis + pool-wake config propagated from the WORKER app's
# env/secrets (values are read worker-side; this list is configured api-side).
AP_SANDBOX_PROPAGATED_ENV_VARS = "AP_REDIS_URL,AP_REDIS_HOST,AP_REDIS_PORT,AP_REDIS_USER,AP_REDIS_PASSWORD,AP_REDIS_DB,AP_REDIS_USE_SSL,TYRBO_BROWSER_POOL_APP,TYRBO_FLY_API_TOKEN,TYRBO_BROWSER_WARM_SPARES,TYRBO_BROWSER_RUN_TIMEOUT_MS,TYRBO_BROWSER_QUEUE_WAIT_MS"

[http_service]
internal_port = 80
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
# the worker long-polls the API, which keeps it awake; 0 still lets Fly
# park it if the worker is scaled down
min_machines_running = 0

[[http_service.checks]]
interval = "15s"
timeout = "5s"
grace_period = "45s"
method = "GET"
path = "/api/v1/health"

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"
