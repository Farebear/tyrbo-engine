# TYRBO-PATCH: Fly staging config for the engine worker (M1).
#
# Deploy:
#   fly deploy -c tyrbo-deploy/fly.worker.staging.toml --image ghcr.io/farebear/tyrbo-engine-worker:<sha>
#
# Secrets (fly secrets set -a tyrbo-engine-worker-staging ...):
#   AP_WORKER_TOKEN — HS256 JWT signed with the API's AP_JWT_SECRET,
#                     payload {id, type: "WORKER", iss: "activepieces"}; see README.md
#
# No [http_service]: the worker has no inbound traffic, it long-polls the API.
# It therefore never auto-stops; scale it down manually when staging is idle
# (fly scale count 0 -a tyrbo-engine-worker-staging).

app = "tyrbo-engine-worker-staging"
primary_region = "iad"

[build]
image = "ghcr.io/farebear/tyrbo-engine-worker:tyrbo"

[env]
AP_CONTAINER_TYPE = "WORKER"
AP_FRONTEND_URL = "https://tyrbo-engine-api-staging.fly.dev"
AP_EXECUTION_MODE = "UNSANDBOXED"
# 4, not 10: staging never needs 10-wide; fewer poll loops = less steady CPU
# on both machines (shared-cpu burst credits are the scarce resource here)
AP_WORKER_CONCURRENCY = "4"
AP_LOG_LEVEL = "warn"
# @tyrbo/piece-browser (M6) executes in this process from the image
# filesystem (piece-installer skips dev pieces). Its BullMQ producer reads
# AP_REDIS_URL — set it as a secret on this app alongside AP_WORKER_TOKEN.
# Wake config for the scale-to-zero browser pool: TYRBO_FLY_API_TOKEN is a
# secret; unset disables wake calls (Farebear/tyrbo docs/SECRETS.md).
AP_DEV_PIECES = "browser"
TYRBO_BROWSER_POOL_APP = "tyrbo-browser-worker-staging"

# 512MB was tried and is NOT enough: engine sandbox processes die with ping
# timeouts under GC pressure and golden-flow runs time out. 1GB is the floor.
[[vm]]
size = "shared-cpu-1x"
memory = "1gb"

swap_size_mb = 512
