# TYRBO-PATCH: compose bring-up for the golden-flow smoke suite.
# Environment (keys, ports, webhook sink) comes from .env.golden, written by
# run.mjs --prepare. See README.md.
services:
  api:
    image: ${TYRBO_ENGINE_API_IMAGE:-tyrbo-engine-api:golden}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '8080:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      AP_CONTAINER_TYPE: APP
      AP_PORT: '80'
      AP_ENVIRONMENT: prod
      AP_EDITION: ce
      # must be resolvable from the worker container too (piece bundles,
      # trigger hooks); production points this at the public URL
      AP_FRONTEND_URL: http://api:80
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
      AP_JWT_SECRET: ${AP_JWT_SECRET}
      AP_POSTGRES_DATABASE: tyrbo
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: '5432'
      AP_POSTGRES_USERNAME: postgres
      AP_POSTGRES_PASSWORD: postgres
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: '6379'
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_TELEMETRY_ENABLED: 'false'
      AP_TYRBO_JWT_PUBLIC_KEY: ${AP_TYRBO_JWT_PUBLIC_KEY}
      AP_TYRBO_API_URL: http://host.docker.internal:4747/run-completed
      AP_TYRBO_WEBHOOK_SECRET: golden-webhook-secret
      # the SSRF filter allowlists IPs/CIDRs; cover docker's host gateway on
      # both Docker Desktop (192.168.65.x) and linux bridge (172.16/12)
      AP_SSRF_ALLOW_LIST: 192.168.65.0/24,172.16.0.0/12
      AP_LOG_LEVEL: info
      # @tyrbo/piece-browser (M6) + @tyrbo/piece-ai (M8.5): file-loaded from
      # the image; the golden suite asserts both appear in the piece registry
      AP_DEV_PIECES: browser,ai
      # the engine child gets a whitelisted env; the pieces (running inside
      # it) need the queue Redis + pool-wake config + Tyrbo-managed AI keys
      # propagated
      AP_SANDBOX_PROPAGATED_ENV_VARS: AP_REDIS_URL,AP_REDIS_HOST,AP_REDIS_PORT,AP_REDIS_USER,AP_REDIS_PASSWORD,AP_REDIS_DB,AP_REDIS_USE_SSL,TYRBO_BROWSER_POOL_APP,TYRBO_FLY_API_TOKEN,TYRBO_BROWSER_WARM_SPARES,TYRBO_BROWSER_RUN_TIMEOUT_MS,TYRBO_BROWSER_QUEUE_WAIT_MS,TYRBO_AI_ANTHROPIC_KEY,TYRBO_AI_OPENAI_KEY,TYRBO_AI_ANTHROPIC_BASE_URL,TYRBO_AI_OPENAI_BASE_URL
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:80/api/v1/flags > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 60

  worker:
    image: ${TYRBO_ENGINE_WORKER_IMAGE:-tyrbo-engine-worker:golden}
    depends_on:
      api:
        condition: service_healthy
    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_FRONTEND_URL: http://api:80
      AP_WORKER_TOKEN: ${AP_WORKER_TOKEN}
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_WORKER_CONCURRENCY: '10'
      AP_LOG_LEVEL: info
      # @tyrbo/piece-browser + @tyrbo/piece-ai execute in this container; the
      # browser piece's BullMQ producer needs the queue Redis
      AP_DEV_PIECES: browser,ai
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: '6379'

  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    environment:
      POSTGRES_DB: tyrbo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # Exposed to the host for run-browser.mjs: its stub browser-run workers
    # consume the piece's BullMQ queues from the host process. 6390 avoids
    # colliding with a locally running redis on 6379.
    ports:
      - '127.0.0.1:6390:6379'
