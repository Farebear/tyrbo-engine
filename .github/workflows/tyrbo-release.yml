# TYRBO-PATCH: builds and publishes the engine images to GHCR, tagged by
# git SHA (plus a moving branch tag). The tyrbo product repo pins these
# images in infra/docker-compose.dev.yml and on Fly.
name: Tyrbo Release

on:
  push:
    branches:
      - tyrbo
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: tyrbo-engine-api
            dockerfile: Dockerfile
          - name: tyrbo-engine-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          base="${{ env.REGISTRY }}/${owner}/${{ matrix.image.name }}"
          echo "sha_tag=${base}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${base}:tyrbo" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.branch_tag }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
